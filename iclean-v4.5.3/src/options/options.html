<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iClean · 设置</title>
<style>
  :root { --primary:#4f7cff; --text:#1f2329; --text2:#5b6472; --line:#eceef2; }
  body { max-width:720px; margin:28px auto; padding:0 16px; font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#fff; }
  h1 { font-size:18px; margin-bottom:6px; }
  .sub { color:var(--text2); margin-bottom:22px; }
  .card { border:1px solid #e2e6ee; border-radius:12px; padding:16px; margin-bottom:16px; background:#fcfdff; box-shadow:0 1px 2px rgba(16,24,40,.045); }
  .card h2 { font-size:16px; margin:0 0 10px; color:var(--text); }
  /* 单行卡片：标题行作为最后一项时不需底部间距，内容上下居中 */
  .card > .set-label-row:last-child { margin-bottom:0; }
  label { display:block; margin:8px 0 4px; font-weight:600; font-size:13px; }
  textarea { width:100%; min-height:80px; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13px; resize:vertical; }
  .btn { padding:8px 14px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-ghost { background:#f2f4f7; color:var(--text); }
  .preset-opts label { font-weight:400; display:flex; align-items:center; gap:8px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--text2); }
  .ok { color:#16a34a; }
  .err { color:#e5484d; }
  .g-row { display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); }
  .g-row:last-of-type { border-bottom:none; }
  .g-key { min-width:88px; font-size:15px; letter-spacing:1px; }
  .g-act { color:var(--text); }
  .fold-block { border:none; }
  .fold-sum { font-size:16px; font-weight:600; color:var(--text); cursor:pointer; list-style:none; display:flex; align-items:center; gap:5px; margin:0; }
  .fold-sum::-webkit-details-marker { display:none; }
  .fold-sum .fold-title { flex:1; min-width:0; }
  .fold-sum::before { content:'▸'; font-size:11px; color:var(--text2); }
  .fold-block[open] .fold-sum::before { content:'▾'; }
  .fold-body { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .fold-body > div { margin-top:0 !important; }
  .fold-block + .fold-block { margin-top:14px; }
  .fold-block { margin-top:12px; }
  .g-list { margin-top:10px; max-height:300px; overflow-y:auto; }
  .g-note { margin-top:8px; font-size:12px; color:var(--text2); }
  /* 二级折叠（手势一览）：放在最后以覆盖基础样式 */
  .fold-block--sub { margin-top:10px; padding-top:8px; border-top:1px dashed rgba(0,0,0,0.06); }
  .fold-block--sub .fold-sum { font-size:12px; font-weight:500; color:var(--text2); }
  .fold-block--sub .g-list { padding-left:10px; margin-top:6px; }
</style>
</head>
<body>
<h1><svg viewBox="0 0 48 48" width="22" height="22" style="vertical-align:-4px;margin-right:6px" aria-hidden="true"><defs><linearGradient id="cc-lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F7CFF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="11" fill="url(#cc-lg)"/><g stroke="#fff" stroke-width="4.5" stroke-linecap="round"><line x1="14" y1="30.5" x2="34.5" y2="21"/><line x1="14" y1="24" x2="31" y2="16.5"/><line x1="14" y1="17.5" x2="26.5" y2="12.5"/></g></svg>iClean · 设置</h1>
<div class="sub">管理默认预设、白名单与清理历史</div>

<div class="card">
  <div class="set-label set-label-row">
    <span style="font-size:16px;font-weight:600">书签在新标签页打开</span>
    <input type="checkbox" id="bm-newtab" checked>
  </div>
</div>

<div class="card">
  <div class="set-label set-label-row" style="margin-bottom:10px">
    <span style="font-size:16px;font-weight:600">鼠标手势与拖拽</span>
    <input type="checkbox" id="gs-nav">
  </div>
  <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
    <span style="font-size:13px">手势灵敏度</span>
    <select id="gs-threshold" style="padding:4px 8px;border:1px solid #eceef2;border-radius:6px">
      <option value="30">低（需划更长）</option>
      <option value="20">中（推荐）</option>
      <option value="12">高（轻微划动）</option>
    </select>
  </div>
    <!-- 手势一览：二级折叠 -->
    <details class="fold-block fold-block--sub">
      <summary id="gesture-summary" class="fold-sum">手势一览</summary>
      <div id="gesture-list" class="g-list"></div>
    </details>
  <details class="fold-block" id="drag-fold">
    <summary class="fold-sum">
    <span id="drag-summary" class="fold-title">超级拖拽</span>
    <input type="checkbox" id="dg-on">
  </summary>
  <div class="fold-body">
    <div style="display:flex;align-items:center;gap:8px;padding-left:20px">
    <input type="checkbox" id="dg-search">
    <span>拖动选中的文字 → 搜索</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding-left:20px">
    <input type="checkbox" id="dg-link">
    <span>拖动链接 → 前台新标签打开</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding-left:20px">
    <input type="checkbox" id="dg-img">
    <span>拖动图片 → 新标签打开图片</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding-left:20px">
    <input type="checkbox" id="dg-input">
    <span>在输入框内不触发拖拽</span>
    </div>
    </div>
  </details>
  <div style="font-size:12px;color:var(--text2);margin-top:10px">手势与拖拽由 FlowMouse 模块提供，修改后立即生效。</div>
</div>

<div class="card">
  <h2>白名单（这些站点在「清理当前页面」时会被跳过）</h2>
  <div>每行一个域名或完整 URL</div>
  <textarea id="whitelist" placeholder="mail.google.com&#10;github.com"></textarea>
  <div style="margin-top:8px">
    <button id="btn-save" class="btn btn-primary">保存</button>
    <button id="btn-reset" class="btn btn-ghost" style="margin-left:8px">恢复默认</button>
  </div>
</div>

<script src="../../js/constants.js"></script>
<script src="../shared/gestureList.js"></script>
<script src="../shared/dataTypes.js"></script>
<script src="../shared/store.js"></script>
<script src="options.js"></script>
</body>
</html>
