<div class="types-fold" id="types-fold">

    <span class="fold-title">🎛 要清理的项目</span>
    <span id="fold-summary" class="fold-summary">已选 0 类</span>
    <span class="fold-arrow">▾</span>

  <div id="types-body" class="types-body" hidden>
    <!-- 折叠框内的两个标签：清理项目 / 白名单 -->

<!-- 设置视图（popup 内） -->
<div id="view-settings" hidden>
  <div class="settings-hd">
    <button id="btn-back" class="hd-text-btn">← 返回</button>
    <span class="settings-title">设置</span>
      <button id="btn-donate" class="donate-btn">❤ 赞赏作者</button>
    <span class="app-version" id="app-version"></span>
  </div>

  <div class="set-card">
    <div class="set-label set-label-row">
      <span>鼠标手势与拖拽</span>
      <input type="checkbox" id="gs-nav" class="switch">
    </div>

    <div class="set-row-inline">
      <span class="set-sub">手势灵敏度</span>
      <select id="gs-threshold" class="select select-sm">
        <option value="30">低 · 需要划更长</option>
        <option value="20">中 · 推荐</option>
        <option value="12">高 · 轻微划动</option>
      </select>
    </div>

      <!-- 手势一览：二级折叠，紧跟手势设置 -->
      <details class="fold-block fold-block--sub">
        <summary id="gesture-summary" class="fold-sum">手势一览</summary>
        <div id="gesture-list" class="g-list"></div>
      </details>

    <details class="fold-block" id="drag-fold">
      <summary class="fold-sum">
          <span id="drag-summary" class="fold-title">超级拖拽</span>
          <input type="checkbox" id="dg-on" class="switch">
        </summary>
        <div class="fold-body">
        <div class="switch-row" style="padding-left:16px">
        <span class="grow"><span class="set-sub">拖动选中的文字 → 搜索</span></span>
        <input type="checkbox" id="dg-search" class="switch">
        </div>
        <div class="switch-row" style="padding-left:16px">
        <span class="grow"><span class="set-sub">拖动链接 → 前台新标签打开</span></span>
        <input type="checkbox" id="dg-link" class="switch">
        </div>
        <div class="switch-row" style="padding-left:16px">
        <span class="grow"><span class="set-sub">拖动图片 → 新标签打开图片</span></span>
        <input type="checkbox" id="dg-img" class="switch">
        </div>
        <div class="switch-row" style="padding-left:16px">
        <span class="grow"><span class="set-sub">在输入框内不触发拖拽</span></span>
        <input type="checkbox" id="dg-input" class="switch">
        </div>
      </div>
    </details>
    <div class="set-note">手势与拖拽由 FlowMouse 模块提供，改动立即生效</div>
  </div>

<div class="set-card">
  <div class="set-label set-label-row">
    <span>选中文字自动复制</span>
    <input type="checkbox" id="ac-on" checked class="switch">

</div>

<div class="set-card">
  <div class="set-label set-label-row">
